<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3830c2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#3a2fc1" />
    <title>Ingresar | Mi Argentina</title>
    <link rel="icon" href="res/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="apple-touch-icon" href="res/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@500;600;700&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #3a2fc1;
        --text: #1f1f1f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: #fff;
      }
      body {
        font-family: "Encode Sans", system-ui, sans-serif;
        color: var(--text);
        max-width: 480px;
        margin: 0 auto;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) 24px
          calc(24px + env(safe-area-inset-bottom));
        -webkit-tap-highlight-color: transparent;
      }

      .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 30px 0;
      }
      /* Placeholder for the brand/logo — replace with <img src="logo.svg" ...> */
      .brand-placeholder {
        width: 100%;
        aspect-ratio: 425 / 81;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9a9a9a;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 2px;
      }
      /* Placeholder for the hand illustration — replace with <img src="hand.svg" ...> */
      .hero-placeholder {
        width: 100%;
        max-width: 300px;
        aspect-ratio: 360 / 399;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9a9a9a;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
      }

      .actions {
        display: flex;
        flex-direction: column;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 56px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
        border: none;
      }
      .btn-primary:active {
        filter: brightness(1.1);
      }

      .divider {
        border: none;
        border-top: 1px solid #e6e6e6;
        margin: 26px 0 22px;
      }

      .signup-q {
        text-align: center;
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 18px;
      }
      .btn-outline {
        background: #fff;
        color: var(--primary);
        border: 1.5px solid var(--primary);
      }
      .btn-outline:active {
        background: #f3f2fc;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div>
        <img src="res/Hand.png" class="hero-placeholder" alt="Ingresar" />
      </div>
      <div>
        <img src="res/LogoMain.png" class="brand-placeholder" alt="Ingresar" />
      </div>
    </div>

    <div class="actions">
      <a href="dashboard.html" class="btn btn-primary"
        >Ingresar con mi cuenta</a
      >
      <hr class="divider" />
      <p class="signup-q">¿No tenés cuenta en Mi Argentina?</p>
      <a href="#" class="btn btn-outline">Crear una cuenta</a>
    </div>
  </body>
</html>
