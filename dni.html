<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3830c2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DNI Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --primary: #3a2fc1; --text: #1f1f1f; --muted: #5f5f5f; --nav-h: 64px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #3830c2; overscroll-behavior: none; }
  body {
    font-family: "Encode Sans", system-ui, sans-serif; color: var(--text);
    background: #f4f4f6;
    max-width: 480px; margin: 0 auto; min-height: 100dvh;
    padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Header ---------- */
  .app-header {
    background: #3830c2; color: #fff;
    padding: env(safe-area-inset-top) 18px 0;
    height: calc(64px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 18px;
  }
  .app-header .back, .app-header .refresh { color: #fff; display: flex; }
  .app-header .title { font-size: 20px; font-weight: 700; flex: 1; }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 4px; color: #fff; }

  /* ---------- Credential card ---------- */
  .card {
    margin: 18px 16px 0; background: #fff; border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12); overflow: hidden;
  }
  .credential { margin: 12px; display: flex; flex-direction: column; gap: 12px; }
  /* NAME placeholder (top bar) and IMAGE placeholder (large block) */
  .ph {
    border: 1.5px dashed #c9c9c9; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #a9a9a9; font-weight: 700; letter-spacing: 2px; font-size: 13px;
  }
  .ph-name { height: 48px; width: 70%; }
  .ph-image { height: 380px; }

  .dots { display: flex; justify-content: center; gap: 9px; padding: 4px 0 10px; }
  .dots span { width: 10px; height: 10px; border-radius: 50%; background: #c6c6c6; }
  .dots span.on { background: var(--primary); }

  .updated {
    text-align: center; font-family: Roboto, sans-serif; font-size: 15px; color: #3a3a3a;
    padding: 0 16px 18px;
  }

  /* action buttons row */
  .actions { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #ececec; }
  .actions button {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 18px 8px; background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 600; color: var(--text);
  }
  .actions button:first-child { border-right: 1px solid #ececec; }
  .actions button svg { width: 24px; height: 24px; color: var(--primary); }

  /* QR row (expandable) */
  .qr-row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 16px 18px; background: none; border: none; border-top: 1px solid #ececec;
    cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--text);
    text-align: left;
  }
  .qr-row .qr-ico { width: 26px; height: 26px; color: var(--primary); flex-shrink: 0; }
  .qr-row .lbl { flex: 1; }
  .qr-row .chev { color: #8a8a8a; transition: transform .25s; }
  .card.qr-open .qr-row .chev { transform: rotate(180deg); }
  .qr-body { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .card.qr-open .qr-body { max-height: 320px; }
  .qr-body-inner { padding: 6px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .qr-placeholder {
    width: 180px; height: 180px; border: 1.5px dashed #d2d2d2; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #b5b5b5; font-family: Roboto, sans-serif; font-size: 12px;
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom); z-index: 10;
    background: #fff; box-shadow: 0 -1px 3px rgba(0,0,0,.06);
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .bottom-nav a {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    text-decoration: none; color: var(--muted);
    font-family: Roboto, sans-serif; font-size: 12px; letter-spacing: .4px;
  }
  .bottom-nav a svg { width: 24px; height: 24px; }
  .bottom-nav a.active { color: var(--primary); font-family: "Encode Sans", sans-serif; font-weight: 700; }
</style>
</head>
<body>

<header class="app-header">
  <a href="docs.html" class="back" aria-label="Volver">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </a>
  <span class="title">DNI Digital</span>
  <button class="icon-btn" aria-label="Actualizar">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-1.5 5.5"/><path d="M20 5v6h-6"/></svg>
  </button>
</header>

<main>
  <div class="card" id="card">
    <!-- Replace this placeholder with the credential image when you have one -->
    <div class="credential">
      <div class="ph ph-name">NOMBRE</div>
      <div class="ph ph-image">IMAGEN</div>
    </div>

    <div class="dots"><span class="on"></span><span></span></div>
    <p class="updated">Última actualización <span id="upd"></span></p>

    <div class="actions">
      <button type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>
        Ver detalle
      </button>
      <button type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        Desactivar DNI
      </button>
    </div>

    <button class="qr-row" onclick="document.getElementById('card').classList.toggle('qr-open')">
      <svg class="qr-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h7v7H3V3Zm2 2v3h3V5H5Zm-2 9h7v7H3v-7Zm2 2v3h3v-3H5ZM14 3h7v7h-7V3Zm2 2v3h3V5h-3Zm-2 9h2v2h-2v-2Zm5 0h2v2h-2v-2Zm-5 3h2v2h-2v-2Zm2 2h3v2h-3v-2Zm3-5v3h-2v-3h2Z"/></svg>
      <span class="lbl">Verifica código QR</span>
      <span class="chev"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>
    <div class="qr-body"><div class="qr-body-inner">
      <div class="qr-placeholder">CÓDIGO QR</div>
    </div></div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="dashboard.html" class="active">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 2.5 11.3l1.3 1.5L5 11.8V21h5v-5.5h4V21h5v-9.2l1.2 1 1.3-1.5Z"/></svg>
    Inicio
  </a>
  <a href="#">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h14v18H4a1 1 0 0 1-1-1Zm15 5h3v12a1 1 0 0 1-1 1h-2Z"/><g fill="#fff"><rect x="5.5" y="6" width="4.5" height="4.5"/><rect x="11.5" y="6.5" width="4" height="1.5"/><rect x="11.5" y="9" width="4" height="1.5"/><rect x="5.5" y="13" width="10" height="1.5"/><rect x="5.5" y="16" width="10" height="1.5"/></g></svg>
    Novedades
  </a>
  <a href="#">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 3h3.5l1.8 4.5-2.3 1.7a11 11 0 0 0 6.8 6.8l1.7-2.3L21 15.5V19a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2Z"/><path d="M14 3a7 7 0 0 1 7 7M14 6.5a3.5 3.5 0 0 1 3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    Teléfonos
  </a>
  <a href="#">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12.5" r="9.5" fill="currentColor"/><path d="M5.5 13.5c0-1 .5-2.2 1.3-3 2.8-.3 5.5-1.6 7-3.3.9 1.7 2.8 3 4.8 3.5.6.8.9 1.8.9 2.8a7.3 7.3 0 0 1-14 0Z" fill="#fff"/><circle cx="9.3" cy="13.8" r=".9" fill="currentColor"/><circle cx="14.7" cy="13.8" r=".9" fill="currentColor"/><path d="M10 16.6c1.2.9 2.8.9 4 0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    Tina
  </a>
</nav>

<script>
  // Show the current date and time, updated live
  const p = n => String(n).padStart(2, '0');
  function updateTime() {
    const d = new Date();
    document.getElementById('upd').textContent =
      `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())} hs`;
  }
  updateTime();
  setInterval(updateTime, 1000);
</script>
</body>
</html>
